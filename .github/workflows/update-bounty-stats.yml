name: Update bounty stats

on:
  push:
    branches: [main]
    paths:
      - "bounties.csv"
      - "scripts/update_bounty_readme.py"
      - ".github/workflows/update-bounty-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate charts and README section
        run: python scripts/update_bounty_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update bounty stats [skip ci]"
            git push
          fi
